<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mud Monster Trucks</title><style>
*{box-sizing:border-box}body{margin:0;background:#14251b;color:white;font: bold 16px system-ui}main{max-width:1050px;margin:auto;padding:8px}h1,h2{color:#ffda50;margin:5px 0}h1{font-size:clamp(20px,4vw,36px)}header,.controls{display:flex;justify-content:space-around;gap:8px;padding:8px;background:#304934;border-radius:10px}canvas{width:100%;height:auto;max-height:52dvh;object-fit:contain;display:block;background:#8bd0ef}button{font:inherit;color:white;background:#426047;border:0;border-radius:10px;padding:12px;cursor:pointer;touch-action:none}button:active{filter:brightness(1.3)}.controls button{flex:1;min-height:55px}input{font:inherit;padding:10px;width:190px;border-radius:8px;border:0}#menu{text-align:center;padding:10px;background:#263b2b}#menu button{margin:3px}#tip{text-align:center;font-size:13px;margin:6px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid #ffffff30}small{color:#c5d8bf}#scene{position:relative}#menu[hidden]{display:none}button:disabled{opacity:.5}</style></head><body><main><h1>🛻 MUD MONSTER TRUCKS</h1><header><span>🏆 <b id="score">0</b></span><span>🪙 <b id="coins">0</b></span><span>🏁 <b id="dist">0</b> m</span><span>⚡ <b id="energy">100</b>%</span></header><div id="scene"><canvas id="c" width="900" height="450"></canvas></div><div id="menu"><h2 id="title">Choose your truck!</h2><p id="msg">Enter your racing nickname.</p><input id="name" maxlength="18" placeholder="Driver name" autocomplete="off"><div id="colors"><button data-color="#e74736" style="background:#b52c22">Red ✓</button><button data-color="#328bf4" style="background:#2164ae">Blue</button><button data-color="#83cc32" style="background:#508b22">Green</button><button data-color="#a759e9" style="background:#7833ac">Purple</button></div><button id="start" style="background:#e77d20">▶ LET'S RIDE!</button></div><div class="controls"><button id="brake" style="background:#a53e35">◀ Brake</button><button id="jump">⬆ Jump</button><button id="boost" style="background:#dc791b">⚡ Turbo</button><button id="gas" style="background:#279e48">Gas ▶</button></div><div id="tip">Hold GAS to drive. Jump and turbo through mud!</div><button id="end" disabled>End ride &amp; save score</button> <small id="driver"></small><h2>🏆 Mud Monster Hall of Fame</h2><table><thead><tr><th>Rank</th><th>Driver</th><th>Distance</th><th>Score</th></tr></thead><tbody id="ranks"></tbody></table><small id="storage">Top 10 scores saved on this browser. Use nicknames!</small></main><script>
const $=id=>document.getElementById(id),g=$('c').getContext('2d');let board=[];try{board=JSON.parse(localStorage.getItem('mudMonsterScoresV2')||'[]');if(!Array.isArray(board))board=[]}catch(e){$('storage').textContent='Scores available for this session only.'}
let color='#e74736',name='',x=0,y=0,v=0,vy=0,coins=0,energy=100,check=0,score=0,running=false,ground=true,ready=true,keys={},last=0,particles=[],taken=new Set();
const terrain=t=>328+24*Math.sin(t/150)+13*Math.sin(t/65)+18*Math.sin(t/310),mud=t=>t>450&&(t+100)%950>660,rand=n=>((Math.sin(n*127.1+311.7)*43758.5453)%1+1)%1;
function ranks(){let b=$('ranks');b.replaceChildren();if(!board.length){let d=b.insertRow().insertCell();d.colSpan=4;d.textContent='Be the first champion!'}board.slice(0,10).forEach((s,i)=>{let r=b.insertRow();[i<3?['🥇','🥈','🥉'][i]:i+1,s.name,s.distance+' m',Number(s.score).toLocaleString()].forEach(t=>r.insertCell().textContent=t)})}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function poly(p,col){g.fillStyle=col;g.beginPath();p.forEach(([a,b],i)=>i?g.lineTo(a,b):g.moveTo(a,b));g.closePath();g.fill()}
function draw(){let cam=x-190,sky=g.createLinearGradient(0,0,0,450);sky.addColorStop(0,'#74c8f4');sky.addColorStop(1,'#e5f3c6');rect(0,0,900,450,sky);circle(760,65,39,'#fff0a1');for(let i=0;i<5;i++){let cx=((i*240-cam*.09)%1200+1200)%1200-100;circle(cx,70+i%2*40,23,'#fff');circle(cx+28,65+i%2*40,32,'#fff');circle(cx+60,76+i%2*40,22,'#fff')}
for(let k=0;k<2;k++){g.beginPath();g.moveTo(0,450);for(let s=0;s<=900;s+=8)g.lineTo(s,210+k*48+Math.sin((s+cam*(.15+k*.12))/150)*45+Math.sin((s+cam*.12)/67)*17);g.lineTo(900,450);g.fillStyle=k?'#709c4e':'#91b7a1';g.fill()}
for(let i=Math.floor(cam/100)-1;i<(cam+900)/100+1;i++){let sx=i*100-cam,ty=terrain(i*100)-20,ht=60+rand(i)*65;rect(sx-5,ty-ht,10,ht,'#795637');for(let j=0;j<3;j++)poly([[sx-35+j*4,ty-20-j*22],[sx,ty-ht-15-j*3],[sx+35-j*4,ty-20-j*22]],j%2?'#315f36':'#397944')}
g.beginPath();g.moveTo(0,450);for(let s=0;s<=900;s+=4)g.lineTo(s,terrain(s+cam));g.lineTo(900,450);g.fillStyle='#79502e';g.fill();for(let s=0;s<900;s+=5){let t=s+cam,ty=terrain(t);rect(s,ty,6,mud(t)?19:9,mud(t)?'#49301d':'#79963b');if(mud(t))rect(s,ty+7,6,3,'#9b693b')}
for(let i=Math.floor(cam/33);i<(cam+900)/33;i++)circle(i*33-cam,terrain(i*33)+24+rand(i)*85,3+rand(i+4)*5,'#966b43');
for(let i=Math.max(1,Math.floor(cam/110));i<(cam+900)/110;i++){if(taken.has(i)||i*110>9000)continue;let t=i*110,cy=terrain(t)-65-(i%4===0?43:0);circle(t-cam,cy,13,'#d98b16');circle(t-cam,cy,10,'#ffdc45');g.fillStyle='#a56b08';g.font='bold 15px sans-serif';g.textAlign='center';g.fillText('$',t-cam,cy+5)}
for(let i=1;i<=5;i++){let t=i*1800,sx=t-cam,ty=terrain(t);if(sx<-100||sx>950)continue;rect(sx,ty-100,6,100,'#eee');for(let a=0;a<4;a++)for(let b=0;b<3;b++)rect(sx+6+a*12,ty-100+b*12,12,12,(a+b)%2?'#fff':'#222');if(i===5){g.fillStyle='#fff';g.font='bold 18px sans-serif';g.fillText('FINISH',sx+25,ty-110)}}
for(let p of particles)circle(p.x-cam,p.y,p.r,p.col);g.save();g.translate(190,y);g.rotate(ground?Math.atan2(terrain(x+25)-terrain(x-25),50):Math.max(-.3,Math.min(.3,vy*.025)));rect(-53,-20,106,15,'#35373a');rect(-49,-38,99,23,color);poly([[-18,-38],[-7,-66],[29,-66],[43,-38]],color);poly([[-9,-42],[0,-59],[13,-59],[13,-42]],'#c3edff');poly([[19,-59],[27,-59],[36,-42],[19,-42]],'#8bc4dc');rect(-51,-32,11,8,'#ffb73d');rect(45,-34,10,9,'#fff5b0');rect(-58,-16,116,6,'#a5b3b7');g.fillStyle='#fff';g.font='bold italic 13px sans-serif';g.textAlign='center';g.fillText('4×4',8,-24);for(let a of [-35,35]){g.save();g.translate(a,0);g.rotate(x/23);circle(0,0,24,'#171b1a');for(let j=0;j<10;j++){g.rotate(Math.PI/5);rect(-5,-25,10,7,'#3c403d')}circle(0,0,13,'#858f91');circle(0,0,7,'#d8e0df');g.restore()}if(keys.boost&&energy>1&&running){poly([[-57,-22],[-100-rand(x)*15,-13],[-57,-5]],'#ff7c16');poly([[-57,-18],[-82,-13],[-57,-9]],'#ffef70')}g.restore();rect(20,15,220,10,'#17291e');rect(20,15,220*Math.min(1,x/9000),10,'#ffda50');g.fillStyle='#233a25';g.font='bold 12px sans-serif';g.textAlign='left';g.fillText('COURSE PROGRESS',20,42)}
function hud(){$('score').textContent=score.toLocaleString();$('coins').textContent=coins;$('dist').textContent=Math.floor(x/10);$('energy').textContent=Math.floor(energy)}
function start(){name=$('name').value.trim();if(!name){$('msg').textContent='Choose a racing name first!';$('name').focus();return}x=0;y=terrain(0)-24;v=vy=coins=check=score=0;energy=100;ground=ready=true;particles=[];taken.clear();keys={};running=true;$('menu').hidden=true;$('end').disabled=false;$('driver').textContent='Driver: '+name;hud()}
function end(won){if(!running)return;running=false;keys={};if(won)score+=500;hud();let best=!board.length||score>board[0].score;board.push({name,distance:Math.floor(x/10),score});board.sort((a,b)=>b.score-a.score||b.distance-a.distance);board=board.slice(0,10);try{localStorage.setItem('mudMonsterScoresV2',JSON.stringify(board))}catch(e){$('storage').textContent='Scores available for this session only.'}ranks();$('title').textContent=best?'NEW HIGH SCORE!':won?'COURSE COMPLETE!':'AWESOME RIDE!';$('msg').textContent=name+' — '+score.toLocaleString()+' points! '+(won?'Finish bonus: +500!':'');$('start').textContent='▶ RIDE AGAIN';$('menu').hidden=false;$('end').disabled=true;$('tip').textContent='Score recorded! Can you beat the champion?'}
function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;if(running){let wet=mud(x)&&ground,boost=keys.boost&&energy>1;if(keys.gas||boost)v+=(boost?.36:wet?.07:.19)*dt;else v*=Math.pow(.98,dt);if(keys.brake)v-=.35*dt;if(wet&&!boost)v*=Math.pow(.96,dt);v=Math.max(0,Math.min(boost?13:wet?3.2:8,v));energy=Math.max(0,Math.min(100,energy+(boost?-.65:.16)*dt));if(keys.jump&&ground&&ready){vy=-12;ground=false;ready=false}if(!keys.jump)ready=true;x=Math.min(9000,x+v*dt);let floor=terrain(x)-24;if(ground)y=floor;else{vy+=.48*dt;y+=vy*dt;if(y>=floor){y=floor;vy=0;ground=true}}if(v>0&&ground&&Math.random()<.8)particles.push({x:x-40,y:y+15,vx:-2-Math.random()*4,vy:-Math.random()*5,r:wet?5+Math.random()*5:2+Math.random()*3,life:35,col:wet?'#624021':'#b9a17b'});for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.2*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);let i=Math.round(x/110);if(i>0&&!taken.has(i)&&Math.abs(x-i*110)<44&&Math.abs(y-35-(terrain(i*110)-65-(i%4===0?43:0)))<48){taken.add(i);coins++;energy=Math.min(100,energy+6)}let nc=Math.floor(x/1800);if(nc>check){check=nc;energy=100;$('tip').textContent='🏁 CHECKPOINT! +100 points and full turbo!'}else if(wet&&!boost)$('tip').textContent='Deep mud! Hit TURBO or JUMP!';else if(x%1800>300)$('tip').textContent='Collect coins and race to the finish!';score=Math.floor(x/10)+coins*10+check*100;hud();if(x>=9000)end(true)}draw();requestAnimationFrame(loop)}
document.querySelectorAll('#colors button').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('#colors button').forEach(z=>z.textContent=z.textContent.replace(' ✓',''));b.textContent+=' ✓'});$('start').onclick=start;$('end').onclick=()=>end(false);for(let k of ['gas','brake','jump','boost']){let b=$(k);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)}let map={ArrowRight:'gas',ArrowLeft:'brake',ArrowUp:'jump',' ':'jump',Shift:'boost',ArrowDown:'boost'};window.addEventListener('keydown',e=>{if(running&&map[e.key]){e.preventDefault();keys[map[e.key]]=true}});window.addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=false});window.addEventListener('blur',()=>keys={});y=terrain(0)-24;ranks();requestAnimationFrame(loop);
</script></body></html>
